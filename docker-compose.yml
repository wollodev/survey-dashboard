services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_SECRET_KEY: "bitte-in-produktion-aendern"
    volumes:
      - survey-data:/app/data
    restart: unless-stopped

volumes:
  survey-data: