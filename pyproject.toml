[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
extend-select = [
    "I",    # import order
    "B",    # common bug sources (bugbear)
    "UP",   # modern Python syntax
    "SIM",  # simplifications
    "DJ",   # Django
    "PD",   # pandas
    "RUF",  # ruff-specific rules
    "TID251",  # banned imports (keeps surveys/data free of Django)
]
ignore = [
    # Django and DRF expect lists as class attributes (Meta.ordering, fields, parser_classes, ...).
    "RUF012",
    # En dashes (–) are intentional in UI text, e.g. age groups like 18–29.
    "RUF001",
    "RUF003",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"django".msg = "surveys/data/ is pure pandas code and must not depend on Django."
"rest_framework".msg = "surveys/data/ is pure pandas code and must not depend on Django."

[tool.ruff.lint.per-file-ignores]
# The import ban only applies inside surveys/data/.
"!surveys/data/**" = ["TID251"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["matplotlib.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.dev"
