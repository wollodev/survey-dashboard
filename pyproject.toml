[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
extend-select = [
    "I",    # import order
    "B",    # common bug sources (bugbear)
    "UP",   # modern Python syntax
    "SIM",  # simplifications
    "DJ",   # Django
    "PD",   # pandas
    "RUF",  # ruff-specific rules
]
ignore = [
    # Django and DRF expect lists as class attributes (Meta.ordering, fields, parser_classes, ...).
    "RUF012",
    # En dashes (–) are intentional in German UI text.
    "RUF001",
    "RUF003",
]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["matplotlib.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.dev"
